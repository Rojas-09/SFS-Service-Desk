<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>SFS Service Desk - Mesa de Ayuda Operativa</title>
    <meta name="description" content="Sistema de gestión de incidentes, soporte técnico corporativo y monitoreo de acuerdos SLA para Software Factory and Services." />
    <meta property="og:title" content="SFS Service Desk - Mesa de Ayuda Operativa" />
    <meta property="og:description" content="Sistema de gestión de incidentes, soporte técnico corporativo y monitoreo de acuerdos SLA para Software Factory and Services." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('sfs_tema');
          var isDark = t === 'oscuro' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) || (t === 'sistema' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
    <script>
      (function() {
        try {
          var p = window.location.pathname;
          var u = localStorage.getItem('sfs_user');
          if (p === '/') {
            if (!u) {
              window.location.replace('/login');
            } else {
              var user = JSON.parse(u);
              if (user && user.role === 'cliente') {
                window.location.replace('/portal');
              } else {
                window.location.replace('/consola/bandeja');
              }
            }
          } else if (!u && (p.indexOf('/consola') === 0 || p.indexOf('/portal') === 0 || p === '/cambiar-contrasena')) {
            window.location.replace('/login?next=' + encodeURIComponent(p + window.location.search));
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F5F7FB] dark:bg-[#081B3A] font-sans text-slate-800 dark:text-[#E8EEF9] antialiased overflow-hidden m-0 p-0 select-none transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
